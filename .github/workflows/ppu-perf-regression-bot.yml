            };
            const validatePayload = (name) => {
              const payload = JSON.parse(readRegularFile(name, 50 * 1024 * 1024));
              exactKeys(payload, ['schema_version', 'cases', 'meta'], `${name} payload`);
              if (payload.schema_version !== 1 || !Array.isArray(payload.cases) ||
                  payload.cases.length > 100000) {
                throw new Error(`${name} has invalid schema version or case count`);
              }
              exactKeys(payload.meta, [], `${name} metadata`);
              for (const [index, row] of payload.cases.entries()) {
                exactKeys(row, [
                  'name', 'latency', 'status', 'file', 'source', 'error', 'duration_s',
                ], `${name} case ${index}`);
                boundedString(row.name, `${name} case name`);
                boundedString(row.file, `${name} case file`);
                boundedString(row.source, `${name} case source`);
                boundedString(row.error, `${name} case error`, 8192, true);
                if (!row.name || !row.file || !row.source ||
                    !['success', 'failed', 'timeout', 'not_found'].includes(row.status) ||
                    typeof row.duration_s !== 'number' || !Number.isFinite(row.duration_s) ||
                    row.duration_s < 0 || row.duration_s > 3600 ||
                    (row.status === 'success' &&
                     (typeof row.latency !== 'number' || !Number.isFinite(row.latency) ||
                      row.latency <= 0)) ||
