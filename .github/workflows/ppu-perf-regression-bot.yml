              }
              if (!shaPattern.test(process.env.BASE_SHA) ||
                  !shaPattern.test(process.env.HEAD_SHA)) {
                throw new Error('frozen base/head SHA is invalid');
              }
              if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$/.test(process.env.BASE_REF) ||
                  process.env.BASE_REF.includes('..') || process.env.BASE_REF.includes('//') ||
                  process.env.BASE_REF.includes('@{') || process.env.BASE_REF.endsWith('.') ||
                  process.env.BASE_REF.endsWith('/') || process.env.BASE_REF.endsWith('.lock') ||
                  process.env.BASE_REF.split('/').some(part => !part || part.startsWith('.')) ||
                  /[\0\r\n]/.test(process.env.BASE_REF)) {
                throw new Error('frozen base ref is invalid');
              }
              const expectedRequestKey = requestKind === 'comment'
                ? `comment-${process.env.COMMENT_ID}`
                : `push-${process.env.HEAD_SHA}`;
              const expectedTriggerLabel = requestKind === 'comment'
                ? `@ppu-regression (comment #${process.env.COMMENT_ID})`
                : `push to \`feature/ci-testing-dev\` @ \`${process.env.HEAD_SHA.substring(0, 8)}\``;
              if (process.env.REQUEST_KEY !== expectedRequestKey ||
                  process.env.TRIGGER_LABEL !== expectedTriggerLabel) {
                throw new Error('request display metadata is inconsistent');
              }
              if (process.env.GITHUB_REPOSITORY !== 't-head/tilelang-for-sail' ||
                  process.env.GITHUB_SERVER_URL !== 'https://github.com') {
                throw new Error('unexpected GitHub repository or server URL');
              }
              if (!['success', 'failure', 'cancelled', 'skipped'].includes(
                    process.env.LINT_RESULT) ||
                  !['success', 'failure', 'cancelled', 'skipped'].includes(
                    process.env.PPU_RESULT)) {
                throw new Error('job result metadata is outside the GitHub result enum');
              }
            } catch (error) {
              core.setFailed(`Invalid frozen metadata from trusted job outputs: ${error}`);
              return;
            }

            const ownershipMarker =
              `<!-- ppu-perf-regression-890p kind=${requestKind} request_order=${requestOrder} run_id=${runId} run_attempt=${runAttempt} -->`;
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
            const triggerLabel = process.env.TRIGGER_LABEL;
            const artifactDir = process.env.ARTIFACT_DIR;
            const expectedArtifactDir = path.join(process.env.GITHUB_WORKSPACE, 'publisher-artifact');
            if (artifactDir !== expectedArtifactDir || /[\0\r\n]/.test(artifactDir) ||
                process.env.PPU_IMAGE !==
                  'download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.10.0-ubuntu24.04-hggcrt3-py312-20261005') {
              core.setFailed('Publisher path or image metadata is not trusted');
              return;
            }

            let report = '';
            let gate = null;
            let gateRc = null;
            let artifactValidationFailed = false;
            const requiresArtifact = process.env.LINT_RESULT === 'success' &&
              (process.env.PPU_RESULT === 'success' || process.env.PPU_RESULT === 'failure');
            const hashedArtifactFiles = [
              'gate_rc.txt', 'regression_result.md', 'regression_result.png',
              'regression_compare.json', 'old_payload.json', 'new_payload.json',
            ];
            const expectedArtifactFiles = new Set([
              'publisher_metadata.json', ...hashedArtifactFiles,
            ]);
            const artifactLimits = new Map([
              ['publisher_metadata.json', 32768], ['gate_rc.txt', 2],
              ['regression_result.md', 56000],
              ['regression_result.png', 10 * 1024 * 1024],
              ['regression_compare.json', 10 * 1024 * 1024],
              ['old_payload.json', 50 * 1024 * 1024],
              ['new_payload.json', 50 * 1024 * 1024],
            ]);
            const artifactBuffers = new Map();
            const readRegularBuffer = (name, maxBytes) => {
              if (artifactBuffers.has(name)) return artifactBuffers.get(name);
              if (!expectedArtifactFiles.has(name) || path.basename(name) !== name) {
                throw new Error('attempted to read an unexpected artifact path');
              }
              const filePath = path.join(artifactDir, name);
              const flags = fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0);
              const fd = fs.openSync(filePath, flags);
              try {
                const stat = fs.fstatSync(fd);
                if (!stat.isFile() || stat.size <= 0 || stat.size > maxBytes) {
                  throw new Error(`${name} has an invalid type or size (${stat.size})`);
                }
                const buffer = Buffer.alloc(stat.size);
                let offset = 0;
                while (offset < buffer.length) {
                  const count = fs.readSync(fd, buffer, offset, buffer.length - offset, offset);
                  if (count === 0) throw new Error(`${name} changed while being read`);
                  offset += count;
