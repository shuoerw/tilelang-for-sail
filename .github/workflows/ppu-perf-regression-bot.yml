            } else if (!gate.correctness_ok) {
              statusText = 'Correctness failure';
            } else if (gate.has_performance_regression) {
              statusText = 'Performance regression detected (Phase 0: report-only)';
            } else {
              statusText = 'No regression detected';
            }

            const body = [
              ownershipMarker,
              '## PPU 890P Performance Regression',
              '',
              '| Info | Value |',
              '|------|-------|',
              `| **Status** | ${statusText} |`,
              `| **Base** | \`${process.env.BASE_REF}\` @ \`${process.env.BASE_SHA.substring(0, 8)}\` |`,
              `| **Head** | \`${process.env.HEAD_SHA.substring(0, 8)}\` |`,
              `| **Triggered by** | ${triggerLabel} |`,
              `| **Image** | \`${process.env.PPU_IMAGE}\` |`,
              `| **Workflow** | [Run #${process.env.GITHUB_RUN_ID}, attempt ${process.env.GITHUB_RUN_ATTEMPT}](${runUrl}) |`,
              '| **Board** | ZW-M890P |',
              '| **Manifest** | `maint/scripts/ppu_perf_890p_allowlist.yaml` |',
              '',
              report,
              '',
              '<details><summary>Artifacts</summary>',
              '',
              `- [Download current-run artifact](${runUrl}#artifacts)`,
              `- NAS: \`/mnt/wl_nas/devops/tilelang-ci/perf-regression/${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}/ZW-M890P/\``,
              '',
              '</details>',
            ].join('\n');
            if (Buffer.byteLength(body, 'utf8') > 65536) {
              core.setFailed('Validated comment exceeds GitHub comment size limit');
              return;
            }
            if (requestKind === 'push' || process.env.STATUS_COMMENT_ID === '') {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`);
              return;
            }

            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: statusCommentId,
            });
            if (current.user?.login !== 'github-actions[bot]' || current.user?.type !== 'Bot') {
              core.setFailed('Owned status comment is not authored by the trusted bot');
              return;
            }

            let currentOwnership;
            try {
              currentOwnership = parseOwnership(current.body, requestKind);
            } catch (error) {
              core.setFailed(`Owned status comment has a malformed marker: ${error}`);
              return;
            }
            if (currentOwnership.requestOrder !== requestOrder ||
                currentOwnership.runId !== runId ||
                currentOwnership.runAttempt !== runAttempt) {
              core.notice('A newer request or run attempt owns the status comment; refusing to overwrite it');
              return;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: statusCommentId,
              body,
            });
