                }

                const artifactReport = readRegularFile(
                  'regression_result.md', artifactLimits.get('regression_result.md'));
                if (/[\0\r\x01-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(artifactReport) ||
                    !artifactReport.startsWith('## Performance Regression Report\n') ||
                    !artifactReport.includes('**Verdict:') ||
                    /<!--|-->|<\/?[A-Za-z!][^>\n]*>|(^|[^A-Za-z0-9_])@[A-Za-z0-9_]/u.test(
                      artifactReport)) {
                  throw new Error('regression_result.md does not match the restricted report form');
                }
