                  return cases;
                };
                const oldCases = uniqueCases(oldPayload);
                const newCases = uniqueCases(newPayload);
                const oldSuccessNames = new Set(
                  [...oldCases].filter(([, row]) => row.status === 'success').map(([name]) => name));
                const newSuccessNames = new Set(
                  [...newCases].filter(([, row]) => row.status === 'success').map(([name]) => name));
                const commonSuccessCount =
                  [...oldSuccessNames].filter(name => newSuccessNames.has(name)).length;
                const summaryCounts = Object.values(compare.summary);
                const summaryMatchesPayloads =
                  compare.summary.old_total === oldCases.size &&
                  compare.summary.old_success === oldSuccessNames.size &&
                  compare.summary.new_total === newCases.size &&
                  compare.summary.new_success === newSuccessNames.size &&
                  compare.summary.common_success === commonSuccessCount;
                if (!comparisonsValid || !sourceFailuresValid ||
                    !Array.isArray(gate.source_failures) ||
                    JSON.stringify(gate.source_failures) !== JSON.stringify(compare.source_failures) ||
