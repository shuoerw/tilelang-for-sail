                    gate.correctness_ok !== (gate.correctness_failures.length === 0) ||
                    typeof gate.has_performance_regression !== 'boolean' ||
                    gate.regression_threshold !== 0.95 ||
                    !Number.isInteger(gate.num_compared) || gate.num_compared < 0 ||
                    !Number.isInteger(gate.num_regressions) || gate.num_regressions < 0 ||
                    gate.num_compared !== compare.comparisons.length ||
                    gate.num_regressions !== gate.performance_regressions.length ||
