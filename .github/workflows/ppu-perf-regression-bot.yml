                }
              }
              return payload;
            };
            const escapeMarkdown = (value, label) => {
              const safe = boundedString(value, label, 512, false);
              if (!safe) throw new Error(`${label} must not be empty`);
              return safe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/@/g, '&commat;')
                .replace(/[\\`*_[\]{}()#+\-.!|]/g, '\\$&');
            };
            const renderTrustedReport = (comparison) => {
              const lines = [
                '## Validated Performance Results',
                '',
                '| Metric | Value |',
                '|--------|-------|',
                `| Old cases (success/total) | ${comparison.summary.old_success}/${comparison.summary.old_total} |`,
                `| New cases (success/total) | ${comparison.summary.new_success}/${comparison.summary.new_total} |`,
                `| Common success | ${comparison.summary.common_success} |`,
                `| Regressions below ${comparison.gate.regression_threshold.toFixed(2)}x | ${comparison.gate.num_regressions} |`,
                `| Correctness OK | ${comparison.gate.correctness_ok ? 'Yes' : 'No'} |`,
                '',
              ];
              if (comparison.comparisons.length) {
                lines.push(
                  '### Comparison', '',
                  '| Benchmark | Source | Old (ms) | New (ms) | Speedup | Delta | Status |',
                  '|-----------|--------|----------|----------|---------|-------|--------|',
                );
                for (const row of comparison.comparisons) {
                  lines.push(
                    `| ${escapeMarkdown(row.name, 'comparison name')} | ${escapeMarkdown(row.source, 'comparison source')} | ${row.old_latency.toFixed(4)} | ${row.new_latency.toFixed(4)} | ${row.speedup.toFixed(4)}x | ${row.delta_pct.toFixed(2)}% | ${row.status} |`,
                  );
                }
                lines.push('');
              }
              const appendList = (heading, values) => {
                if (!values.length) return;
                lines.push(`### ${heading}`, '');
                for (const value of values) {
                  lines.push(`- ${escapeMarkdown(value, heading)}`);
                }
                lines.push('');
              };
              appendList('Old Success to New Failed', comparison.old_success_new_failed);
              appendList('Only in Old', comparison.only_old);
              appendList('Only in New', comparison.only_new);
              appendList('Invalid Latency', comparison.invalid_latency_cases);
              appendList('Performance Regressions', comparison.gate.performance_regressions);
              if (comparison.source_failures.length) {
                lines.push('### Source-level Failures', '');
                for (const failure of comparison.source_failures) {
                  const statuses = failure.new_statuses.map(
                    value => escapeMarkdown(value, 'source status')).join(', ');
                  const affected = failure.affected_old_cases.map(
                    value => escapeMarkdown(value, 'affected case')).join(', ');
                  lines.push(
                    `- ${escapeMarkdown(failure.source, 'source failure')}: new status ${statuses}; old successful cases: ${affected}`,
                  );
                }
                lines.push('');
              }
              appendList('Correctness Failures', comparison.gate.correctness_failures);
              const verdict = !comparison.gate.correctness_ok
                ? 'FAIL (correctness)'
                : comparison.gate.has_performance_regression
                  ? 'WARN (performance regression, Phase 0 report-only)'
                  : 'PASS';
              lines.push(`**Verdict: ${verdict}**`, '');
              const rendered = lines.join('\n');
              if (Buffer.byteLength(rendered, 'utf8') > 50000) {
                throw new Error('trusted structured report exceeds its bounded size');
              }
              return rendered;
            };

            if (requiresArtifact) {
              try {
                if (!shaPattern.test(process.env.EXPECTED_NEW_TREE)) {
                  throw new Error('frozen merge tree SHA is unavailable or invalid');
                }
                const artifactStat = fs.lstatSync(artifactDir);
                if (!artifactStat.isDirectory() || artifactStat.isSymbolicLink()) {
                  throw new Error('artifact root is not a regular directory');
                }
                const actualFiles = fs.readdirSync(artifactDir);
                if (actualFiles.length !== expectedArtifactFiles.size ||
                    actualFiles.some(name => !expectedArtifactFiles.has(name))) {
                  throw new Error('artifact file set does not match the exact publisher schema');
                }
                for (const name of actualFiles) {
                  const entryStat = fs.lstatSync(path.join(artifactDir, name));
                  if (!entryStat.isFile() || entryStat.isSymbolicLink()) {
                    throw new Error(`${name} is not a regular non-symlink artifact file`);
                  }
                }
                const metadata = JSON.parse(readRegularFile(
                  'publisher_metadata.json', artifactLimits.get('publisher_metadata.json')));
                const rawGateRc = readRegularFile(
                  'gate_rc.txt', artifactLimits.get('gate_rc.txt'));
