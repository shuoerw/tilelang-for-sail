                gate = null;
                gateRc = null;
                report = '';
              }
            }

            let statusText;
            if (process.env.LINT_RESULT === 'failure') {
              statusText = 'Lint or frozen merge check failed — PPU benchmarks skipped';
            } else if (process.env.LINT_RESULT === 'cancelled') {
              statusText = 'Lint check cancelled, usually because a newer request superseded this run';
            } else if (process.env.LINT_RESULT === 'skipped') {
              statusText = 'Lint check skipped — PPU benchmarks did not run';
            } else if (process.env.PPU_RESULT === 'cancelled') {
              statusText = 'PPU run cancelled, usually because a newer request superseded this run';
            } else if (process.env.PPU_RESULT === 'skipped') {
