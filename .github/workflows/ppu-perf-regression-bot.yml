                  throw new Error('invalid canonical gate exit code');
                }
                gateRc = rawGateRc[0];
                exactKeys(metadata, [
                  'schema_version', 'pr_number', 'request_kind', 'request_order', 'comment_id',
                  'base_ref', 'base_sha', 'head_sha', 'new_tree', 'run_id', 'run_attempt',
                  'gate_rc', 'artifact_sha256',
                ], 'publisher metadata');
                exactKeys(metadata.artifact_sha256, hashedArtifactFiles, 'artifact SHA-256 manifest');
                const expectedCommentField = requestKind === 'comment' ? commentId : null;
                if (metadata.schema_version !== 3 ||
                    metadata.pr_number !== prNumber ||
                    metadata.request_kind !== requestKind ||
                    metadata.request_order !== requestOrder ||
                    metadata.comment_id !== expectedCommentField ||
                    metadata.base_ref !== process.env.BASE_REF ||
                    metadata.base_sha !== process.env.BASE_SHA ||
                    metadata.head_sha !== process.env.HEAD_SHA ||
                    metadata.new_tree !== process.env.EXPECTED_NEW_TREE ||
                    metadata.run_id !== process.env.GITHUB_RUN_ID ||
                    metadata.run_attempt !== runAttempt ||
                    metadata.gate_rc !== gateRc ||
                    !shaPattern.test(metadata.new_tree)) {
                  throw new Error('publisher metadata does not match frozen resolve-pr outputs');
                }
                for (const name of hashedArtifactFiles) {
                  const claimed = metadata.artifact_sha256[name];
                  if (typeof claimed !== 'string' || !/^[0-9a-f]{64}$/.test(claimed)) {
                    throw new Error('artifact SHA-256 manifest contains an invalid digest');
                  }
                  const expectedDigest = Buffer.from(claimed, 'hex');
                  const actualDigest = crypto.createHash('sha256')
                    .update(readRegularBuffer(name, artifactLimits.get(name))).digest();
                  if (expectedDigest.length !== actualDigest.length ||
                      !crypto.timingSafeEqual(expectedDigest, actualDigest)) {
                    throw new Error('artifact SHA-256 digest mismatch');
                  }
                }

                const oldPayload = validatePayload('old_payload.json');
                const newPayload = validatePayload('new_payload.json');
                if (oldPayload.cases.length === 0 || newPayload.cases.length === 0) {
                  throw new Error('benchmark payloads must contain at least one case');
                }

                const compare = JSON.parse(readRegularFile('regression_compare.json', 10 * 1024 * 1024));
                if (!compare || typeof compare !== 'object' || Array.isArray(compare) ||
                    !compare.gate || typeof compare.gate !== 'object' || Array.isArray(compare.gate) ||
                    !compare.summary || typeof compare.summary !== 'object' || Array.isArray(compare.summary)) {
                  throw new Error('regression_compare.json is not an object with gate and summary objects');
                }
                exactKeys(compare, [
                  'comparisons', 'only_old', 'only_new', 'old_success_new_failed',
                  'source_failures', 'invalid_latency_cases', 'gate', 'summary',
                ], 'comparison result');
                gate = compare.gate;
                exactKeys(gate, [
                  'correctness_ok', 'correctness_failures', 'source_failures',
                  'performance_regressions', 'regression_threshold',
                  'has_performance_regression', 'num_compared', 'num_regressions',
                ], 'comparison gate');
                exactKeys(compare.summary, [
                  'old_total', 'old_success', 'new_total', 'new_success', 'common_success',
                ], 'comparison summary');
                const isStringArray = (values, allowNewlines = false) =>
                  Array.isArray(values) && values.length <= 256 &&
                  values.every(value => {
                    try {
                      boundedString(
                        value, 'comparison string', allowNewlines ? 4096 : 512, allowNewlines);
                      return true;
                    } catch {
                      return false;
                    }
                  });
                const stringArrays = [
                  compare.only_old, compare.only_new, compare.old_success_new_failed,
                  compare.invalid_latency_cases, gate.correctness_failures,
                  gate.performance_regressions,
                ];
                const comparisonsValid = Array.isArray(compare.comparisons) &&
                  compare.comparisons.length <= 256 &&
                  compare.comparisons.every(row => {
                    if (!row || typeof row !== 'object' || Array.isArray(row)) return false;
                    try {
                      exactKeys(row, [
                        'name', 'source', 'old_latency', 'new_latency', 'speedup',
                        'delta_pct', 'status',
                      ], 'comparison row');
                    } catch {
                      return false;
                    }
                    try {
                      boundedString(row.name, 'comparison name');
                      boundedString(row.source, 'comparison source');
                    } catch {
                      return false;
                    }
                    return row.name.length > 0 && row.source.length > 0 &&
                      ['improved', 'regressed'].includes(row.status) &&
                      ['old_latency', 'new_latency', 'speedup', 'delta_pct'].every(
                        key => typeof row[key] === 'number' && Number.isFinite(row[key]),
                      ) && row.old_latency > 0 && row.old_latency <= 1e9 &&
                      row.new_latency > 0 && row.new_latency <= 1e9 &&
                      row.speedup > 0 && row.speedup <= 1e6 &&
                      row.delta_pct >= -100 && row.delta_pct <= 1e8;
                  });
                const sourceFailuresValid = Array.isArray(compare.source_failures) &&
                  compare.source_failures.length <= 256 &&
                  compare.source_failures.every(item => {
                    try {
                      exactKeys(item, [
                        'source', 'new_statuses', 'affected_old_cases', 'errors',
                      ], 'source failure');
                      boundedString(item.source, 'source failure identity');
                    } catch {
                      return false;
                    }
                    return item.source.length > 0 && isStringArray(item.new_statuses) &&
                      item.new_statuses.every(status =>
                        ['failed', 'timeout', 'not_found'].includes(status)) &&
                      isStringArray(item.affected_old_cases) && isStringArray(item.errors, true);
                  });
                const allowedCorrectnessFailures = new Set([
                  'all_old_failed', 'all_new_failed', 'zero_common_success',
                  'old_success_new_failed', 'source_failure', 'invalid_latency',
